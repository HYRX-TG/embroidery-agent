<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知绣坊 · Agent 团队工作台</title>
<style>
  :root {
    --primary: #8b3a3a; --primary-light: #a85151; --bg: #f7f3ee;
    --card: #ffffff; --text: #3d2b2b; --muted: #9a8a8a;
    --border: #e8ddd3; --accent: #4a6b57;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 18px; font-weight: 600; }
  header a { color: rgba(255,255,255,.85); font-size: 13px; text-decoration: none; border: 1px solid rgba(255,255,255,.4); border-radius: 6px; padding: 4px 10px; }
  header a:hover { background: rgba(255,255,255,.15); }
  #status { font-size: 12px; opacity: .9; margin-left: auto; }
  .agents-bar { display: flex; gap: 8px; padding: 10px 24px; background: var(--card); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .agent-chip { border: 1px solid var(--border); border-radius: 16px; padding: 5px 14px; font-size: 13px; cursor: pointer; background: #fff; color: var(--muted); transition: all .15s; user-select: none; }
  .agent-chip:hover { border-color: var(--primary); color: var(--primary); }
  .agent-chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  #messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  .msg { display: flex; gap: 10px; max-width: 78%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; color: #fff; background: var(--accent); }
  .msg.user .avatar { background: var(--primary); }
  .bubble { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .msg.user .bubble { background: var(--primary); color: #fff; border-color: var(--primary); }
  .msg.fallback .bubble { background: #fdf6e3; border-color: #e6d8a8; }
  .badge { display: inline-block; font-size: 11px; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 1px 6px; margin-bottom: 6px; }
  .hint { text-align: center; color: var(--muted); font-size: 13px; padding: 40px 0; }
  .chat-form { display: flex; gap: 10px; padding: 14px 24px; background: var(--card); border-top: 1px solid var(--border); }
  .chat-form textarea { flex: 1; resize: none; border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; font-size: 14px; font-family: inherit; outline: none; max-height: 120px; }
  .chat-form textarea:focus { border-color: var(--primary); }
  .chat-form button { background: var(--primary); color: #fff; border: none; border-radius: 10px; padding: 0 26px; font-size: 14px; cursor: pointer; }
  .chat-form button:disabled { opacity: .5; cursor: not-allowed; }
  .chat-form button:hover:not(:disabled) { background: var(--primary-light); }
</style>
</head>
<body>
<header>
  <h1>🧵 知绣坊 · Agent 团队工作台</h1>
  <a href="/">← 客服前台</a>
  <span id="status">正在检查本地服务…</span>
</header>

<div class="agents-bar" id="agents-bar"></div>

<div id="messages">
  <div class="hint">选择专家或直接输入（默认自动路由）。试试：<br>
  「2kg 绣品发华东，哪家便宜」 · 「30×40cm 手工绣 10 幅报个价」 · 「100 幅机绣订单多久能交」</div>
</div>

<form class="chat-form" id="chat-form">
  <textarea id="input" placeholder="向团队提问，例如：5kg 发华北用德邦多少钱？" rows="1"></textarea>
  <button type="submit" id="send-btn">发送</button>
</form>

<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const messages = $("#messages");
  const form = $("#chat-form");
  const input = $("#input");
  const sendBtn = $("#send-btn");
  let agents = [];
  let selected = "";   // 空 = 自动路由
  let sessionId = localStorage.getItem("emb_team_session") || "";
  let staffPass = localStorage.getItem("emb_team_staff_pass") || "";

  function ensureStaffPass() {
    if (!staffPass) {
      staffPass = prompt("请输入员工工作台口令（由管理员配置，生产环境走环境变量）：") || "";
      localStorage.setItem("emb_team_staff_pass", staffPass);
    }
    return staffPass;
  }
  function staffHeaders(extra) {
    return Object.assign({}, extra, staffPass ? { "X-Staff-Access": staffPass } : {});
  }

  function nowTime() {
    const d = new Date();
    return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  }

  function renderRagStatus(info) {
    const el = document.createElement("div");
    el.style.cssText = "font-size:11px;color:var(--muted);text-align:center;padding:4px 0;background:var(--card);border-bottom:1px solid var(--border);";
    if (info && info.rag) {
      const r = info.rag;
      el.textContent = r.index_ready
        ? `📚 外挂知识库已接入：${r.chunks} 条 / ${r.files} 个文件（本地 bge-m3 向量检索）`
        : "📚 外挂知识库：暂无数据（可运行 scripts/fetch_team_kb.py + 重建索引）";
      messages.parentElement.insertBefore(el, messages);
    }
  }

  async function loadTeamStatus() {
    try {
      ensureStaffPass();
      const res = await fetch("/api/v1/team/status", { headers: staffHeaders() });
      if (res.ok) renderRagStatus(await res.json());
      else if (res.status === 403) {
        localStorage.removeItem("emb_team_staff_pass"); staffPass = "";
        document.getElementById("status").textContent = "口令无效，请重新输入";
      }
    } catch (e) { /* 口令不足等，静默 */ }
  }

  function addMsg(role, text, kind, agentName) {
    messages.querySelector(".hint")?.remove();
    const wrap = document.createElement("div");
    wrap.className = "msg " + role + (kind === "fallback" ? " fallback" : "");
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "员" : "团";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if (agentName) {
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = agentName;
      bubble.appendChild(badge);
    }
    const span = document.createElement("span");
    span.textContent = text;
    bubble.appendChild(span);
    wrap.append(avatar, bubble);
    messages.appendChild(wrap);
    messages.scrollTop = messages.scrollHeight;
    return span;
  }

  function renderAgentChips() {
    const bar = $("#agents-bar");
    bar.innerHTML = "";
    const auto = document.createElement("span");
    auto.className = "agent-chip" + (selected === "" ? " active" : "");
    auto.textContent = "🎯 自动路由";
    auto.onclick = () => { selected = ""; renderAgentChips(); };
    bar.appendChild(auto);
    agents.forEach(a => {
      const chip = document.createElement("span");
      chip.className = "agent-chip" + (selected === a.id ? " active" : "");
      chip.textContent = a.name;
      chip.title = a.description;
      chip.onclick = () => { selected = a.id; renderAgentChips(); };
      bar.appendChild(chip);
    });
  }

  async function loadAgents() {
    try {
      ensureStaffPass();
      let res = await fetch("/api/v1/team/agents", { headers: staffHeaders() });
      if (res.status === 403) {
        localStorage.removeItem("emb_team_staff_pass"); staffPass = "";
        ensureStaffPass();
        res = await fetch("/api/v1/team/agents", { headers: staffHeaders() });
      }
      const data = await res.json();
      agents = data.agents || [];
      renderAgentChips();
    } catch (e) { $("#status").textContent = "专家列表加载失败"; }
  }

  async function checkStatus() {
    try {
      const res = await fetch("/health");
      if (res.ok) { $("#status").textContent = "● 本地服务在线"; return; }
    } catch (e) {}
    $("#status").textContent = "● 服务离线";
  }

  function parseSSE(reader, onEvent) {
    const decoder = new TextDecoder();
    let buf = "";
    function pump() {
      return reader.read().then(({ done, value }) => {
        if (done) return;
        buf += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf("\n\n")) !== -1) {
          const block = buf.slice(0, idx);
          buf = buf.slice(idx + 2);
          const eventMatch = block.match(/^event: (.+)$/m);
          const dataMatch = block.match(/^data: (.+)$/m);
          if (eventMatch && dataMatch) {
            try { onEvent(eventMatch[1], JSON.parse(dataMatch[1])); } catch (e) {}
          }
        }
        return pump();
      });
    }
    return pump();
  }

  async function send(text) {
    addMsg("user", text);
    const span = addMsg("assistant", "", null, null);
    let agentName = "";
    sendBtn.disabled = true;
    try {
      ensureStaffPass();
      const res = await fetch("/api/v1/team/chat", {
        method: "POST",
        headers: Object.assign({ "Content-Type": "application/json" }, staffHeaders()),
        body: JSON.stringify({ content: text, session_id: sessionId, agent: selected }),
      });
      if (res.status === 403) {
        localStorage.removeItem("emb_team_staff_pass"); staffPass = "";
        span.textContent = "口令无效，请刷新页面重新输入。";
        return;
      }
      const sid = res.headers.get("X-Session-Id");
      if (sid) { sessionId = sid; localStorage.setItem("emb_team_session", sid); }
      const reader = res.body.getReader();
      await parseSSE(reader, (event, data) => {
        if (event === "agent") {
          agentName = data.name;
          span.parentElement.querySelector(".badge").textContent = agentName;
        } else if (event === "delta" && data.text) {
          span.textContent += data.text;
          messages.scrollTop = messages.scrollHeight;
        } else if (event === "error") {
          span.textContent += "\n⚠️ " + (data.message || "生成中断");
        }
      });
    } catch (e) {
      span.textContent = "请求失败，请确认后端服务已启动。";
    }
    if (!span.textContent) span.textContent = "（未收到回复）";
    sendBtn.disabled = false;
    input.focus();
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (sendBtn.disabled) return;
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    send(text);
  });

  // 回车发送；Shift+Enter 换行
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  loadAgents();
  checkStatus();
  loadTeamStatus();
  input.focus();
})();
</script>
</body>
</html>
