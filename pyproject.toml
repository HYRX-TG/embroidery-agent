[project]
name = "embroidery-agent"
version = "0.1.0"
description = "刺绣企业私有化本地离线智能客服 Agent：本地 LLM + RAG + 双角色客服（客户顾问 / 员工助手）"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = [
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
  "pydantic-settings>=2.2.1",
  "httpx>=0.27.0",
]
retrieval = [
  "numpy>=1.24",
  "faiss-cpu>=1.8.0",
  "sentence-transformers>=3.0.0",
  "jieba>=0.42.1",
]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
